name: Выжимка видео без речи (каждый день до конца списка)

# Owner 2026-11-25 (DEC-331): videos without speech (path "frames") get a maximum extract by Gemini watching the
# video; the text becomes their NotebookLM source and their knowledge extract. Resumable: done videos are skipped,
# so the daily start simply continues the list until it is finished (then it ends in a minute).

on:
  schedule:
    - cron: "40 8 * * *"   # 08:40 UTC = 12:40 Baku, after the free Gemini quota reset (12:00 Baku)
  workflow_dispatch:
    inputs:
      ids_file:
        description: "Список видео (в закрытом хранилище)"
        default: "registry/knowledge/frames-extracts/applications.easy-income.ids.txt"
      out_dir:
        description: "Куда класть выжимки"
        default: "registry/knowledge/frames-extracts/applications.easy-income"

permissions:
  contents: read

concurrency:
  group: frames-extract
  cancel-in-progress: false

env:
  QLOG: ${{ github.workspace }}/trial/results/runlogs/frames-extract-${{ github.run_number }}.txt
  IDS_FILE: ${{ inputs.ids_file || 'registry/knowledge/frames-extracts/applications.easy-income.ids.txt' }}
  OUT_DIR: ${{ inputs.out_dir || 'registry/knowledge/frames-extracts/applications.easy-income' }}
defaults:
  run:
    shell: /home/runner/work/_temp/quiet.sh {0}

jobs:
  run:
    name: Выжимки видео без речи
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          repository: m-reqemsal-ai/ii-arhitektor
          ref: main
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - name: Тихий запуск (подробности только в закрытом хранилище)
        shell: bash
        run: |
          mkdir -p "$(dirname "$QLOG")"
          cat > "$RUNNER_TEMP/quiet.sh" <<'QEOF'
          #!/bin/bash
          bash --noprofile --norc -eo pipefail "$1" >> "$QLOG" 2>&1
          rc=$?
          echo "[шаг завершён, код $rc]" >> "$QLOG"
          [ $rc -ne 0 ] && echo "Шаг завершился с ошибкой, код $rc (подробности в закрытом хранилище)"
          exit $rc
          QEOF
          chmod +x "$RUNNER_TEMP/quiet.sh"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Установка
        run: pip install "google-genai==2.28.0"
      - name: Выжимки
        continue-on-error: true
        timeout-minutes: 320
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
        run: python3 -u programs/knowledge/frames_extract.py --ids "$IDS_FILE" --out "$OUT_DIR" --budget-min 300
      - name: Записать в хранилище
        shell: bash
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # refresh the final-notebook bundles so the browser program picks up the new extracts (DEC-333)
          python3 -I programs/notebooklm/final_load.py --topic applications.easy-income --topic-no 1 || true
          git add -A trial/results/runlogs "$OUT_DIR" registry/notebooklm/final-load 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Выжимка видео без речи: запуск ${{ github.run_number }}"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            git push -q origin "HEAD:refs/heads/pending-frames-${{ github.run_number }}" || true
            echo "::error::Results could not be merged into main; saved on branch pending-frames-${{ github.run_number }}"
            exit 1
          fi
