name: Сортировка по тексту для списка видео (вручную)

# Owner 2026-11-25: videos of the starting collection were carded before text triage existed, so the daily
# triage (status 'pending' only) never gave them a topic and they stayed outside every topic queue.
# This manual run sorts an explicit list of ids (one per line, file in the private repository).

on:
  workflow_dispatch:
    inputs:
      ids_file:
        description: "Файл со списком видео (в закрытом хранилище)"
        default: "registry/triage-requests/start-collection.txt"
      budget_min:
        description: "Предел времени, минуты"
        default: "40"

permissions:
  contents: read

concurrency:
  group: cards          # same group as the daily cards run: never two writers of registry/triage.json at once
  cancel-in-progress: false

env:
  QLOG: ${{ github.workspace }}/trial/results/runlogs/triage-ids-${{ github.run_number }}.txt
defaults:
  run:
    shell: /home/runner/work/_temp/quiet.sh {0}

jobs:
  run:
    name: Сортировка списка видео
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: m-reqemsal-ai/ii-arhitektor
          ref: main
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - name: Тихий запуск (подробности только в закрытом хранилище)
        shell: bash
        run: |
          mkdir -p "$(dirname "$QLOG")"
          cat > "$RUNNER_TEMP/quiet.sh" <<'QEOF'
          #!/bin/bash
          bash --noprofile --norc -eo pipefail "$1" >> "$QLOG" 2>&1
          rc=$?
          echo "[шаг завершён, код $rc]" >> "$QLOG"
          [ $rc -ne 0 ] && echo "Шаг завершился с ошибкой, код $rc (подробности в закрытом хранилище)"
          exit $rc
          QEOF
          chmod +x "$RUNNER_TEMP/quiet.sh"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Установка
        run: pip install "google-genai==2.28.0"
      - name: Проверка без запросов
        run: python3 -I programs/triage/test_triage.py
      - name: Сортировка по тексту
        continue-on-error: true
        timeout-minutes: 50
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IDS_FILE: ${{ inputs.ids_file }}
          BUDGET: ${{ inputs.budget_min }}
        run: |
          ids=$(grep -v '^\s*$' "$IDS_FILE" | paste -sd, -)
          python3 -u programs/triage/triage.py --ids "$ids" --budget-min "$BUDGET" --out-report "trial/results/triage-ids-${{ github.run_number }}"
      - name: Записать в хранилище
        shell: bash
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trial/results/runlogs registry/triage.json registry/video_meta.json "trial/results/triage-ids-${{ github.run_number }}" 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Сортировка по тексту для списка видео: запуск ${{ github.run_number }}"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            git push -q origin "HEAD:refs/heads/pending-triage-${{ github.run_number }}" || true
            echo "::error::Results could not be merged into main; saved on branch pending-triage-${{ github.run_number }}"
            exit 1
          fi
