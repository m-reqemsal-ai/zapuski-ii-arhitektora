name: Карточки видео (каждый день)

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 12:00 Baku; the Gemini free quota resets at 12:00 Baku from 2026-11-02 (DEC-121)
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # the run may start its own next run (DEC-175)

concurrency:
  group: cards
  cancel-in-progress: false

env:
  QLOG: ${{ github.workspace }}/trial/results/runlogs/cards-daily-${{ github.run_number }}.txt
defaults:
  run:
    shell: ${{ runner.temp }}/quiet.sh {0}

jobs:
  run:
    name: Следующие видео стартового сбора
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
        with:
          repository: m-reqemsal-ai/ii-arhitektor
          ref: main
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - name: Тихий запуск (подробности только в закрытом хранилище)
        shell: bash
        run: |
          mkdir -p "$(dirname "$QLOG")"
          cat > "$RUNNER_TEMP/quiet.sh" <<'QEOF'
          #!/bin/bash
          bash --noprofile --norc -eo pipefail "$1" >> "$QLOG" 2>&1
          rc=$?
          echo "[шаг завершён, код $rc]" >> "$QLOG"
          [ $rc -ne 0 ] && echo "Шаг завершился с ошибкой, код $rc (подробности в закрытом хранилище)"
          exit $rc
          QEOF
          chmod +x "$RUNNER_TEMP/quiet.sh"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Установка
        run: pip install "google-genai==2.28.0"
      - name: Проверка без запросов
        run: python3 programs/cards/test_cards.py
      - name: Проверка сведений о видео без запросов
        run: python3 programs/common/test_youtube_meta.py
      - name: Проверка сборщика без запросов
        run: python3 programs/collector/test_collect.py && python3 -I programs/collector/test_rotate.py && python3 -I programs/control/test_plan.py
      - name: Проверка потока без запросов
        run: python3 -I programs/control/test_flow_check.py
      - name: Отбор каналов (допуск и этапы проверки)
        continue-on-error: true
        run: |
          python3 -I programs/channels/test_select.py
          python3 programs/channels/select_channels.py
      - name: Пересмотр языков поиска (раз в месяц, отчёт каждый день)
        run: python3 -I programs/collector/rotate_languages.py
      - name: Сборщик видео по темам и языкам
        continue-on-error: true
        timeout-minutes: 20
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
        run: python3 -u programs/collector/collect.py --out "trial/results/cards-daily-${{ github.run_number }}"
      - name: Сортировка очереди по тексту (стратегия M3, шаг 2)
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 -I programs/triage/test_triage.py
          python3 -u programs/triage/triage.py --budget-min 15 --out-report "trial/results/cards-daily-${{ github.run_number }}"
      - name: Вторая проверка убранных видео (DEC-079)
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 -I programs/triage/test_second_check.py
          python3 -u programs/triage/second_check.py --budget-min 10 --out-report "trial/results/cards-daily-${{ github.run_number }}"
      - name: Ворота перед карточками (DEC-181)
        id: gate
        run: |
          python3 -I programs/control/test_gate.py
          python3 -I programs/control/gate.py .
      - name: Карточки
        if: steps.gate.outputs.hold != 'true'
        timeout-minutes: 145
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          python3 -u programs/cards/make_cards.py
          --config programs/cards/daily.json
          --out "trial/results/cards-daily-${{ github.run_number }}"
          --budget-min 130
      - name: Слежение за новыми моделями
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 programs/models/test_watch.py && python3 programs/models/watch_models.py
      - name: Проверка потока и отчёт Владельцу
        id: flow
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -I programs/control/flow_check.py "trial/results/cards-daily-${{ github.run_number }}"
      - name: Записать в хранилище
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trial/results/runlogs 2>/dev/null || true
          git add registry/video_meta.json registry/triage.json registry/start_collection.json registry/found_videos.json registry/channel_videos.json registry/collector_state.json registry/collector_queries.json registry/language_history.json registry/languages.json registry/languages_report.json registry/models_watch.json registry/channels.json registry/key_limits.json registry/control/flow.json registry/control/gate.json registry/cards "trial/results/cards-daily-${{ github.run_number }}" 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Карточки видео: ежедневный прогон ${{ github.run_number }}"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            # Never lose a finished run: keep its commit on a side branch and turn the run red.
            git push -q origin "HEAD:refs/heads/pending-run-${{ github.run_number }}" || true
            echo "::error::Results could not be merged into main; saved on branch pending-run-${{ github.run_number }}"
            exit 1
          fi
      - name: Следующий запуск (если остановило только время)
        if: success() && steps.flow.outputs.continue == 'true' && false  # off 2026-11-08: GitHub free minutes nearly used (DEC-179)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/cards-daily.yml/dispatches" -f ref=main
